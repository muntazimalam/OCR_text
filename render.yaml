# Render Infrastructure-as-Code Configuration
# Render auto-detects this file and applies settings on next deploy
# Docs: https://docs.render.com/infrastructure-as-code

services:
  - type: web
    name: media-processing-pipeline
    runtime: python
    buildCommand: |
      apt-get update && apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng libgl1 libglib2.0-0 libgomp1 libsm6 libxext6 libxrender1 && rm -rf /var/lib/apt/lists/*
      pip install --upgrade pip && pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PORT
        value: "8000"
      - key: OCR_ENGINE
        value: "auto"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OMP_WAIT_POLICY
        value: "PASSIVE"
      - key: MALLOC_ARENA_MAX
        value: "2"
