# Render Infrastructure-as-Code Configuration
# Render auto-detects this file and applies settings on next deploy
# Docs: https://docs.render.com/infrastructure-as-code

services:
  - type: web
    name: media-processing-pipeline
    runtime: python
    buildCommand: |
      apt-get update && apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng && rm -rf /var/lib/apt/lists/*
      pip install --upgrade pip && pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PORT
        value: "8000"
